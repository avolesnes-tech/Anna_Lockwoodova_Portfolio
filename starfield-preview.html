<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { background: #f5f4ef; margin: 0; padding: 40px; font-family: monospace; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
  h2 { font-size: 32px; color: #1a2a5e; margin: 0; white-space: nowrap; }
  canvas { border: 1px solid #ddd; display: block; }
  p { color: #666; font-size: 12px; margin: 4px 0; }
</style>
</head>
<body>
<div class="row">
  <h2>Prečo si vybrať mňa.</h2>
  <canvas id="sf" width="640" height="144" style="width:320px;height:72px"></canvas>
</div>
<p>Canvas: 320×72 CSS px (640×144 at 2×DPR) | Stars: 130 | Max star radius: 2px | Max glow: 5px</p>

<script>
const canvas = document.getElementById('sf');
const ctx = canvas.getContext('2d');
const dpr = 2, W = 320, H = 72;
ctx.scale(dpr, dpr);

const cy = H * 0.5, sigma = H * 0.32;
function gauss() {
  const u = 1 - Math.random(), v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// Use fixed seed simulation for reproducible test
Math.seedrandom = function(seed) { /* just use Math.random */ };

const stars = [];
for (let i = 0; i < 130; i++) {
  const x = Math.random() * W;
  const y = Math.max(1, Math.min(H - 1, cy + gauss() * sigma));
  const roll = Math.random(); let r, peak, glowR;
  if (roll < 0.62)      { r = 0.3 + Math.random()*0.5; peak = 0.4+Math.random()*0.3; glowR = 0; }
  else if (roll < 0.90) { r = 0.7 + Math.random()*0.6; peak = 0.6+Math.random()*0.3; glowR = r*1.8; }
  else                  { r = 1.2 + Math.random()*0.8; peak = 0.85+Math.random()*0.15; glowR = r*2.5; }
  stars.push({x, y, r, peak, glowR});
}

// Draw all at full brightness (t=5s, fully revealed)
ctx.clearRect(0, 0, W, H);
for (const s of stars) {
  const a = s.peak, rad = s.r;
  ctx.save();
  if (s.glowR > 0 && rad > 0.3) {
    const ge = rad + s.glowR;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, ge);
    g.addColorStop(0,    `rgba(255,255,255,${a})`);
    g.addColorStop(0.15, `rgba(220,230,255,${a*0.6})`);
    g.addColorStop(0.45, `rgba(130,160,240,${a*0.18})`);
    g.addColorStop(1,    'rgba(60,90,200,0)');
    ctx.beginPath(); ctx.arc(s.x, s.y, ge, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0.25, rad), 0, Math.PI*2);
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
  ctx.restore();
}
</script>
</body>
</html>
